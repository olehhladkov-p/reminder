services:
  # Combined API + worker - Render's free tier has no Background Worker
  # service type, so apps/api/src/renderStart.ts runs both the Hono API and
  # apps/worker's poll/nightly loops in this one process. See that file and
  # apps/worker/src/run.ts for why.
  - type: web
    name: reminder-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm turbo run build --filter=@reminder/api...
    startCommand: node apps/api/dist/renderStart.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Off in production. For preview environments: after enabling Preview
      # Environments on this Blueprint, open this var in the reminder-api
      # service's Environment tab and give it a separate preview value of
      # `true` - that makes preview deploys log magic-link URLs to the
      # service logs instead of sending real email through Resend. Note this
      # only covers magic-link auth: RESEND_API_KEY/RESEND_FROM_EMAIL below
      # still need some non-empty value even so, since channels.ts builds the
      # (separate) reminder-notification email channel eagerly at startup and
      # the Resend SDK throws if the key is empty - a placeholder key is fine
      # for previews since that code path won't be exercised by sign-in
      # testing. See apps/api/src/env.ts, apps/api/src/magicLinkEmail.ts, and
      # apps/api/src/channels.ts.
      - key: DEV_LOG_MAGIC_LINK
        value: false
      # Neon Postgres - pooled connection (same DB as local dev).
      #
      # For preview environments: don't point this at the production
      # database. Create a Neon branch for previews (Neon dashboard -> your
      # project -> Branches -> create branch from `main`, e.g. named
      # "preview") and use *that* branch's pooled connection string as this
      # var's separate preview value in the reminder-api service's
      # Environment tab (same mechanism as DEV_LOG_MAGIC_LINK above).
      # Otherwise magic-link sign-ins during preview testing create real rows
      # in the production `user`/`session`/`account` tables. A Neon branch is
      # a cheap copy-on-write snapshot, so it starts with production's schema
      # and data without needing its own migration run.
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      # Set to the reminder-web static site's public URL, NOT this service's
      # own URL. The web app proxies /v1/* to this service (see
      # reminder-web's routes below), so from the browser's perspective auth
      # is same-origin with the web app - magic-link emails and the session
      # cookie need to match that origin, or Safari's ITP silently drops the
      # cookie on iOS. See apps/api/src/auth.ts for details.
      - key: BETTER_AUTH_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # reminder-web's custom domain (see its `domains` entry below):
      # https://dailytrace.dev. Must be set explicitly in Render's dashboard
      # - if left unset it silently falls back to http://localhost:5173 (see
      # apps/worker/src/env.ts), which is why email "View subscription"
      # links used to point at an unreachable page.
      - key: WEB_APP_ORIGIN
        sync: false

  # PWA static site - free, no spin-down, backed by Render's CDN.
  - type: web
    name: reminder-web
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm turbo run build --filter=@reminder/web...
    staticPublishPath: apps/web/dist
    domains:
      # Apex domain - www.dailytrace.dev redirects here (configured
      # separately at the DNS/registrar level).
      - dailytrace.dev
    envVars:
      # VITE_API_URL is intentionally NOT set here in production - apps/web's
      # config.ts falls back to the page's own origin, and the rewrite rule
      # below proxies /v1/* to the API. This keeps auth same-origin from the
      # browser's perspective (see apps/api/src/auth.ts). Only set VITE_API_URL
      # for local dev (apps/web/.env), where the API runs on a different port.
      - key: VITE_VAPID_PUBLIC_KEY
        sync: false
    routes:
      # Proxy API calls through this origin so the session cookie set during
      # magic-link verification is first-party to the web app, not the API's
      # separate onrender.com origin. Safari's ITP blocks SameSite=None
      # cross-site cookies on fetch(), which broke magic-link sign-in on iOS
      # when the web app called the API's origin directly. Must come before
      # the SPA fallback rule below since Render evaluates routes in order.
      # TODO: replace with reminder-api's actual onrender.com URL if it differs.
      - type: rewrite
        source: /v1/*
        destination: https://reminder-api-3sr2.onrender.com/v1/*
      # Client-side routing (React Router) - unknown paths fall through to
      # index.html instead of 404ing.
      - type: rewrite
        source: /*
        destination: /index.html
