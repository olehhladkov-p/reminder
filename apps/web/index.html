<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111111" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="alternate icon" href="/favicon.ico" />
    <title>Subscription Reminder</title>
    <style>
      /* Only the installed (standalone) PWA gets a splash - a regular
         browser tab already has its own chrome/URL bar for context. */
      #splash {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        align-items: center;
        justify-content: center;
        background: #ffffff;
      }
      @media (display-mode: standalone), (display-mode: fullscreen) {
        #splash {
          display: flex;
        }
      }
      @media (prefers-color-scheme: dark) {
        #splash {
          background: #111111;
        }
      }
      #splash img {
        width: 96px;
        height: 96px;
        animation: splash-pulse 1.4s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.6;
        }
      }
      #splash.splash-hide {
        opacity: 0;
        transition: opacity 200ms ease-out;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <img src="/favicon.svg" width="96" height="96" alt="" />
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
